[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "aivideo-bench"
version = "0.1.0"
description = "A 100-point benchmark for media agents operating real AIVideo MCP tools"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "InfobotAI"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
aivideo-bench = "aivideo_bench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
